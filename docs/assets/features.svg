<svg xmlns="http://www.w3.org/2000/svg" width="960" height="245" viewBox="0 0 960 245" role="img" aria-labelledby="title desc">
  <title id="title">G HUB Battery Widget features</title>
  <desc id="desc">Portable, private, multi-monitor aware, and independently translucent</desc>
